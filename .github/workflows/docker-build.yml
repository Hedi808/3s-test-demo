name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/hedi808/3s-test-demo
  APP_PORT: "3000"
  HEALTH_PATH: "/api/status"

jobs:
  build-app-image:
    name: Build app image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for PR validation
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-check

      - name: Smoke test PR image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e

          docker rm -f cloudmind-pr-smoke >/dev/null 2>&1 || true

          docker run -d \
            --name cloudmind-pr-smoke \
            -p "${{ env.APP_PORT }}:${{ env.APP_PORT }}" \
            "${{ env.IMAGE_NAME }}:pr-check"

          cleanup() {
            docker logs cloudmind-pr-smoke || true
            docker rm -f cloudmind-pr-smoke >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl -fsS "http://localhost:${{ env.APP_PORT }}${{ env.HEALTH_PATH }}"; then
              echo "Smoke test passed."
              exit 0
            fi

            echo "Waiting for app to become healthy... attempt $attempt"
            sleep 3
          done

          echo "Smoke test failed."
          exit 1

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
